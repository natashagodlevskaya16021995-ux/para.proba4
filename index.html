<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link id="font-link" rel="stylesheet" href="">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; width: 100vw; font-family: -apple-system, sans-serif; }
        #ui { position: fixed; top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; pointer-events: none; }
        #lives { display: flex; gap: 8px; margin-bottom: 10px; }
        .life { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; transition: 0.3s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        #p-wrap { width: 200px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); }
        #p-bar { width: 0%; height: 100%; transition: 0.3s; }

        .card {
            position: absolute;
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            transition: filter .4s ease, transform .18s ease;
            /* Убираем все дефолтные стили, всё через JS */
            background-color: transparent;
            border: none;
        }

        .card.sel {
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.9)) drop-shadow(0 0 25px rgba(0,122,255,0.5));
            transform: scale(1.05);
            z-index: 50;
        }
        
        .card.bad { filter: drop-shadow(0 0 12px rgba(255,59,48,0.7)); }
        .card.good { filter: drop-shadow(0 0 12px rgba(52,199,89,0.7)); }

        /* --- СТИЛЬ IPHONE (ГЛАЗУРЬ) --- */
        .overlay { 
            position: fixed; inset: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 2000; 
            background: rgba(0, 0, 0, 0.15); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }
        
        .glass-box {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 25px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 300px; /* Уменьшили размер */
            width: 80%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .glass-box h1 { margin: 0 0 8px 0; font-size: 24px; color: #000; font-weight: 700; }
        .glass-box p { margin: 0 0 20px 0; font-size: 15px; color: #3a3a3c; line-height: 1.3; }

        .btn-style { 
            padding: 12px 24px; 
            cursor: pointer; 
            border-radius: 14px; 
            border: none; 
            font-weight: 600; 
            font-size: 16px; 
            color: #fff; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
            transition: 0.2s;
            width: 100%;
        }
        .btn-style:active { transform: scale(0.97); }

        #fb { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 160px; height: 160px; z-index: 1000; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><div id="lives"></div><div id="p-wrap"><div id="p-bar"></div></div></div>
    <div id="game"></div><img id="fb">

    <div id="start-screen" class="overlay">
        <div class="glass-box">
            <h1 id="st-t"></h1>
            <p id="st-d"></p>
            <button id="st-b" class="btn-style" onclick="startGame()"></button>
        </div>
    </div>

    <div id="win-screen" class="overlay" style="display:none;">
        <div class="glass-box">
            <img id="wi-img" style="max-height:120px; border-radius:15px; margin-bottom:15px; display:none; margin-inline:auto;">
            <h1 id="wt"></h1>
            <p id="wd"></p>
            <button class="btn-style rb" onclick="location.reload()"></button>
        </div>
    </div>

    <div id="lose-screen" class="overlay" style="display:none;">
        <div class="glass-box">
            <img id="li-img" style="max-height:120px; border-radius:15px; margin-bottom:15px; display:none; margin-inline:auto;">
            <h1 id="lt"></h1>
            <p id="ld"></p>
            <button class="btn-style rb" onclick="location.reload()"></button>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const get = (n, d) => { let v = params.get(n); return (v===null||v==='null'||v==='') ? d : v; };
    const SOUND_BASE = "https://natashagodlevskaya16021995-ux.github.io/para.proba4/sounds/";
    const DEFAULT_BG_IMAGE = "https://media.tenor.com/5fq2aN6QFB4AAAAi/blue-butterfly-colector.gif"; 

    const DEFAULTS = {
        winPopup:  'https://media.tenor.com/423qsjyZqSsAAAAi/yes.gif', 
        losePopup: 'https://media.tenor.com/Va6g-Dh5pSkAAAAi/bunny-nope.gif', 
        life:      'https://media.tenor.com/iNdYjrgY90MAAAAi/red-heart-bumping.gif', 
        winScreen: 'https://media.tenor.com/CuKhzQTvzV0AAAAi/%D0%BA%D0%BE%D1%82%D1%91%D0%BD%D0%BE%D0%BA-%D0%B3%D0%B0%D0%B2-kitten-named-woof.gif', 
        loseScreen:'https://media.tenor.com/I5bwJxpmFAsAAAAi/crying-sad.gif'
    };

    function playSound(file) {
        try {
            let param = 's_' + file.replace('.mp3', '');
            let custom = get(param, '');
            if (custom && (custom.includes('.gif') || custom.includes('.png') || custom.includes('.jpg'))) custom = '';
            let src = custom ? custom : (SOUND_BASE + file);
            const a = new Audio(src);
            a.volume = 1.0; 
            a.play().catch(e => { });
        } catch(e) {}
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    const font = get('font', 'Arial');
    const effect = get('effect', '');
    if (font !== 'Arial' || effect) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        const cleanEffect = effect.replace('font-effect-', '');
        let url = `https://fonts.googleapis.com/css?family=${font.replace(/ /g, '+')}`;
        if (cleanEffect) url += `&effect=${cleanEffect}`;
        link.href = url;
        document.head.appendChild(link);
    }
    document.body.style.fontFamily = `'${font}', sans-serif`;

    const pColor = get('pcolor', '#007aff'); 
    document.getElementById('st-t').innerText = get('st_t', 'Привет!');
    document.getElementById('st-d').innerText = get('st_d', 'Найди пары');
    document.getElementById('st-b').innerText = get('st_b', 'ИГРАТЬ');
    document.getElementById('st-b').style.background = pColor;
    document.getElementById('wt').innerText = get('wt', 'Победа!');
    document.getElementById('wd').innerText = get('wd', 'Молодец!');
    document.getElementById('lt').innerText = get('lt', 'Ой!');
    document.getElementById('ld').innerText = get('ld', 'Попробуй еще раз');
    document.querySelectorAll('.rb').forEach(b => {
        b.innerText = get('rb', 'ЗАНОВО');
        b.style.background = pColor;
    });

    const finalWinImg = get('wi') || DEFAULTS.winScreen;
    if(finalWinImg) { const i=document.getElementById('wi-img'); i.src=finalWinImg; i.style.display='block'; }
    const finalLoseImg = get('li') || DEFAULTS.loseScreen;
    if(finalLoseImg) { const i=document.getElementById('li-img'); i.src=finalLoseImg; i.style.display='block'; }

    let allData = [];
    try {
        const rawNew = get('pairs', null);
        allData = (rawNew && rawNew !== 'null' && rawNew !== '') ? JSON.parse(rawNew) : [];
    } catch(e) { allData = []; }

    const limit = parseInt(get('limit', 2));
    const extraCount = parseInt(params.has('extraCount') ? get('extraCount', 0) : get('extra_c', 0));
    let fSize = get('fsize', '25px');
    if (/^\d+$/.test(fSize)) fSize = fSize + 'px';
    const speed = parseFloat(get('speed', 2));
    const cSize = parseInt(get('csize', 140));

    document.getElementById('p-bar').style.backgroundColor = pColor;
    const lifeUrl = get('lifeimg') || DEFAULTS.life;
    const lDiv = document.getElementById('lives');
    if (lifeUrl) for(let i=0; i<3; i++) lDiv.innerHTML += `<div class="life" style="background-image:url('${lifeUrl}')"></div>`;

    function buildDeckNoRepeat() {
        const base = allData.slice();
        shuffle(base);
        const activePairs = base.slice(0, Math.min(limit, base.length));
        const remaining = base.slice(activePairs.length);
        let deck = [];
        activePairs.forEach((p, i) => { deck.push({t: p.a, id: i}); deck.push({t: p.b, id: i}); });
        const activeText = new Set();
        activePairs.forEach(p => { activeText.add(String(p.a)); activeText.add(String(p.b)); });
        let trapPool = [];
        remaining.forEach(p => {
            const pick = Math.random() > 0.5 ? p.a : p.b;
            if (!activeText.has(String(pick))) trapPool.push(pick);
        });
        trapPool = Array.from(new Set(trapPool));
        shuffle(trapPool);
        const finalTraps = trapPool.slice(0, Math.max(0, extraCount));
        finalTraps.forEach((t, i) => { deck.push({t: t, id: -100 - i}); });
        shuffle(deck);
        const sig = deck.filter(x => x.id >= 0).map(x => `${x.id}:${x.t}`).sort().join('|') + `__traps:${finalTraps.join(',')}`;
        return { deck, activePairs, sig };
    }

    const memoryKey = 'para.proba4.lastSig';
    let built = buildDeckNoRepeat();
    try { sessionStorage.setItem(memoryKey, built.sig); } catch(e){}

    const deck = built.deck;
    const activePairs = built.activePairs;
    let lives = 3, found = 0, selected = [], cards = [], gameStarted = false;

    function placeNonOverlapping(existing, bounds) {
        const minDist = Math.max(30, Math.floor(cSize * 0.85));
        for (let t = 0; t < 220; t++) {
            const x = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
            const y = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
            let ok = true;
            for (const p of existing) {
                const dx = (p.x - x); const dy = (p.y - y);
                if ((dx*dx + dy*dy) < (minDist*minDist)) { ok = false; break; }
            }
            if (ok) return { x, y };
        }
        return { x: bounds.minX + Math.random() * (bounds.maxX - bounds.minX), y: bounds.minY + Math.random() * (bounds.maxY - bounds.minY) };
    }

    const bounds0 = (function() {
        const ui = document.getElementById('ui');
        const r = ui.getBoundingClientRect();
        return { minX: 0, maxX: Math.max(0, window.innerWidth - cSize), minY: Math.min(window.innerHeight - cSize, Math.ceil(r.bottom + 10)), maxY: Math.max(0, window.innerHeight - cSize) };
    })();
    const placed = [];

    // --- УМНАЯ ЛОГИКА ФОНА ---
    const customBg = get('cimg','');
    const useDefBg = get('def_bg') === '1';
    let finalBgUrl = useDefBg ? DEFAULT_BG_IMAGE : customBg;

    const bgC = get('bg_c', 'rgba(255,255,255,0.8)');
    const bC = get('b_c', '#ffffff');
    const bW = get('b_w', '1');
    const bR = get('b_r', '20');

    deck.forEach(item => {
        const el = document.createElement('div');
        el.className = `card ${get('effect','')}`;
        const isImage = String(item.t).startsWith('http');
        
        // РЕШАЕМ: Нужна ли рамка и фон?
        let cardStyle = '';
        if (finalBgUrl) {
            // Если выбран фон-бабочка -> у всех карточек этот фон
            cardStyle = `background-image:url('${finalBgUrl}'); background-size:cover; border:none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);`;
        } else {
            if (isImage) {
                // Если фона нет и это картинка -> полная прозрачность
                cardStyle = `background: transparent; border: none; box-shadow: none;`;
            } else {
                // Если фона нет и это текст -> рисуем рамку
                cardStyle = `background: ${bgC}; border: ${bW}px solid ${bC}; border-radius: ${bR}px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);`;
            }
        }

        el.style.cssText = `width:${cSize}px; height:${cSize}px; ${cardStyle} font-size:${fSize}; color:${get('fcolor','#333')};`;

        if (isImage) el.innerHTML = `<img src="${item.t}" style="max-width: 90%; max-height: 90%; object-fit: contain; pointer-events: none;">`;
        else el.innerText = item.t;

        el.onclick = () => {
            if (el.classList.contains('sel') || el.dataset.done || selected.length >= 2) return;
            playSound('click.mp3');
            el.classList.add('sel');
            selected.push({el, id: item.id});
            if(selected.length === 2) {
                const [s1, s2] = selected;
                const fb = document.getElementById('fb');
                if(s1.id === s2.id && s1.id >= 0) {
                    found++;
                    fb.src = get('winimg') || DEFAULTS.winPopup;
                    document.getElementById('p-bar').style.width = (found/Math.max(1, activePairs.length))*100 + '%';
                    selected.forEach(s => { s.el.classList.add('good'); s.el.style.display = 'none'; s.el.dataset.done = '1'; });
                    if(found === activePairs.length) {
                        playSound('win.mp3');
                        setTimeout(() => { document.getElementById('win-screen').style.display='flex'; try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch(e){} }, 800);
                    } else playSound('ok.mp3');
                } else {
                    lives--; fb.src = get('loseimg') || DEFAULTS.losePopup;
                    const icons = document.querySelectorAll('.life'); if(icons[lives]) icons[lives].style.opacity = '0.1';
                    selected.forEach(s => { s.el.classList.add('bad'); s.el.classList.remove('sel'); });
                    setTimeout(() => { selected.forEach(s => s.el.classList.remove('bad')); selected = []; }, 1500);
                    if(lives <= 0) { playSound('lose.mp3'); setTimeout(() => { document.getElementById('lose-screen').style.display='flex'; }, 800); }
                    else playSound('bad.mp3');
                }
                fb.style.transform = 'translate(-50%, -50%) scale(1)';
                setTimeout(() => { fb.style.transform = 'translate(-50%, -50%) scale(0)'; if(selected.length===2) selected=[]; }, 600);
            }
        };

        const pos = placeNonOverlapping(placed, bounds0);
        placed.push(pos);
        const cObj = { el, x: pos.x, y: pos.y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed };
        document.getElementById('game').appendChild(el);
        cards.push(cObj);
    });

    function startGame() { document.getElementById('start-screen').style.display='none'; gameStarted=true; loop(); }
    function loop() {
        if(!gameStarted) return;
        const b = { maxX: window.innerWidth - cSize, maxY: window.innerHeight - cSize };
        cards.forEach(c => {
            if(c.el.dataset.done) return;
            c.x += c.vx; c.y += c.vy;
            if(c.x < 0) { c.x = 0; c.vx *= -1; } if(c.x > b.maxX) { c.x = b.maxX; c.vx *= -1; }
            if(c.y < 50) { c.y = 50; c.vy *= -1; } if(c.y > b.maxY) { c.y = b.maxY; c.vy *= -1; }
            c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
        });
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
