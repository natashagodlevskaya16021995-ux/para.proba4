<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link id="font-link" rel="stylesheet" href="">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; width: 100vw; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        
        /* --- UI --- */
        #ui { position: fixed; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 20px; box-sizing: border-box; z-index: 100; pointer-events: none; }
        .ui-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-left { align-items: flex-start; width: 120px; }
        .ui-center { align-items: center; flex-grow: 1; }
        .ui-right { align-items: flex-end; width: 120px; }

        #lives { display: flex; gap: 5px; height: 30px; }
        .life { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; transition: 0.3s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        #p-wrap { width: 180px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); margin-top: 5px; }
        #p-bar { width: 0%; height: 100%; transition: 0.3s; }

        .glass-tag { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5); color: #1c1c1e; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; min-width: 60px; justify-content: center; transition: transform 0.2s; }
        .pop-anim { animation: scorePop 0.3s ease-out; }
        @keyframes scorePop { 50% { transform: scale(1.3); color: #007aff; } }

        /* --- КАРТОЧКИ --- */
        .card {
            position: absolute;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            transition: filter .3s ease, transform .18s ease;
            background-color: transparent;
            border: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); 
        }

        .card.sel {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)) drop-shadow(0 0 15px rgba(0,122,255,0.8));
            transform: scale(1.1);
            z-index: 50;
        }
        .card.bad { filter: drop-shadow(0 0 10px rgba(255,59,48,0.8)); }
        .card.good { filter: drop-shadow(0 0 10px rgba(52,199,89,0.8)); }

        /* --- ОКНА --- */
        .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-box { background: rgba(255, 255, 255, 0.85); padding: 30px 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.5); text-align: center; max-width: 320px; width: 85%; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .glass-box img { max-height: 140px; border-radius: 15px; margin-bottom: 20px; display: none; margin-inline: auto; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .glass-box h1 { margin: 0 0 10px 0; font-size: 26px; color: #000; font-weight: 800; }
        .glass-box p { margin: 0 0 25px 0; font-size: 16px; color: #3c3c43; line-height: 1.4; }
        .btn-style { padding: 14px 28px; cursor: pointer; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transition: 0.2s; width: 100%; text-transform: uppercase; }
        .btn-style:active { transform: scale(0.96); }
        #fb { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 160px; height: 160px; z-index: 1000; transition: 0.3s; pointer-events: none; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2)); }
    </style>
</head>
<body>
    
    <div id="ui">
        <div class="ui-group ui-left"><div id="timer-box" class="glass-box glass-tag" style="display:none;">00:00</div></div>
        <div class="ui-group ui-center"><div id="lives"></div><div id="p-wrap"><div id="p-bar"></div></div></div>
        <div class="ui-group ui-right"><div id="score-box" class="glass-box glass-tag">0</div></div>
    </div>

    <div id="game"></div><img id="fb">

    <div id="start-screen" class="overlay"><div class="glass-box"><h1 id="st-t"></h1><p id="st-d"></p><button id="st-b" class="btn-style" onclick="startGame()"></button></div></div>
    <div id="win-screen" class="overlay" style="display:none;"><div class="glass-box"><img id="wi-img"><h1 id="wt"></h1><p id="wd"></p><button class="btn-style rb" onclick="location.reload()"></button></div></div>
    <div id="lose-screen" class="overlay" style="display:none;"><div class="glass-box"><img id="li-img"><h1 id="lt"></h1><p id="ld"></p><button class="btn-style rb" onclick="location.reload()"></button></div></div>
    <div id="timeout-screen" class="overlay" style="display:none;"><div class="glass-box"><img id="to-img" src="" style="display:block"><h1 id="to-t">Время вышло!</h1><p id="to-d">Но ты можешь закончить.</p><button id="to-b" class="btn-style" onclick="closeTimeout()">ПРОДОЛЖИТЬ</button></div></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const get = (n, d) => { let v = params.get(n); return (v===null||v==='null'||v==='') ? d : v; };
    const SOUND_BASE = "https://natashagodlevskaya16021995-ux.github.io/para.proba4/sounds/";
    const DEFAULTS = {
        winPopup: 'https://media.tenor.com/423qsjyZqSsAAAAi/yes.gif', losePopup: 'https://media.tenor.com/Va6g-Dh5pSkAAAAi/bunny-nope.gif', life: 'https://media.tenor.com/iNdYjrgY90MAAAAi/red-heart-bumping.gif', 
        winScreen: 'https://media.tenor.com/CuKhzQTvzV0AAAAi/%D0%BA%D0%BE%D1%82%D1%91%D0%BD%D0%BE%D0%BA-%D0%B3%D0%B0%D0%B2-kitten-named-woof.gif', loseScreen: 'https://media.tenor.com/I5bwJxpmFAsAAAAi/crying-sad.gif',
        timeOutImg: 'https://media.tenor.com/eLdxy73pAQcAAAAi/cant-wait-countdown.gif',
        bg: 'https://media.tenor.com/5fq2aN6QFB4AAAAi/blue-butterfly-colector.gif',
        
        // Звуки по умолчанию
        snd_timeout: SOUND_BASE + 'time.mp3' 
    };

    function playSound(file) {
        try {
            let param = 's_' + file.replace('.mp3', '');
            let custom = get(param, '');
            if (custom && (custom.includes('.gif') || custom.includes('.png') || custom.includes('.jpg'))) custom = '';
            
            // Если звук таймера, берем дефолт или то что пришло
            if (file === 'time.mp3' && !custom) custom = DEFAULTS.snd_timeout;

            let src = custom ? custom : (SOUND_BASE + file);
            new Audio(src).play().catch(()=>{});
        } catch(e) {}
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    const font = get('font', 'Arial');
    const effect = get('effect', '');
    if (font !== 'Arial' || effect) {
        const link = document.createElement('link'); link.rel = 'stylesheet';
        let url = `https://fonts.googleapis.com/css?family=${font.replace(/ /g, '+')}`;
        if (effect) url += `&effect=${effect.replace('font-effect-', '')}`;
        link.href = url; document.head.appendChild(link);
    }
    document.body.style.fontFamily = `'${font}', sans-serif`;

    const pColor = get('pcolor', '#007aff'); 
    const els = document.querySelectorAll('.btn-style, #p-bar'); els.forEach(el => el.style.background = pColor);
    document.querySelectorAll('.rb').forEach(b => b.innerText = get('rb', 'ЗАНОВО'));

    document.getElementById('st-t').innerText = get('st_t', 'Привет!'); document.getElementById('st-d').innerText = get('st_d', 'Найди пары'); document.getElementById('st-b').innerText = get('st_b', 'ИГРАТЬ');
    document.getElementById('wt').innerText = get('wt', 'Победа!'); document.getElementById('wd').innerText = get('wd', 'Молодец!');
    document.getElementById('lt').innerText = get('lt', 'Ой!'); document.getElementById('ld').innerText = get('ld', 'Попробуй еще раз');
    document.getElementById('to-t').innerText = get('to_t', 'Время вышло!'); document.getElementById('to-d').innerText = get('to_d', 'Но ты можешь закончить.');
    document.getElementById('to-img').src = get('to_i') || DEFAULTS.timeOutImg;

    const finalWinImg = get('wi') || DEFAULTS.winScreen; if(finalWinImg) { const i=document.getElementById('wi-img'); i.src=finalWinImg; i.style.display='block'; }
    const finalLoseImg = get('li') || DEFAULTS.loseScreen; if(finalLoseImg) { const i=document.getElementById('li-img'); i.src=finalLoseImg; i.style.display='block'; }

    let timeLimit = parseInt(get('time', 0)); 
    let timerInterval, score = 0, combo = 0;

    function formatTime(s) { let m = Math.floor(s / 60); let sec = s % 60; return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
    function updateScore(points) {
        score += points; if(score < 0) score = 0;
        const sb = document.getElementById('score-box'); sb.innerText = score;
        sb.classList.remove('pop-anim'); void sb.offsetWidth; sb.classList.add('pop-anim');
        sb.style.color = points > 0 ? '#34c759' : '#ff3b30';
        setTimeout(() => sb.style.color = '#1c1c1e', 300);
    }

    let allData = [];
    try { const rawNew = get('pairs', null); allData = (rawNew && rawNew !== 'null') ? JSON.parse(rawNew) : []; } catch(e) { allData = []; }

    const limit = parseInt(get('limit', 2));
    const extraCount = parseInt(params.has('extraCount') ? get('extraCount', 0) : get('extra_c', 0));
    const cSize = parseInt(get('csize', 140));
    let fSize = get('fsize', '25px'); if (/^\d+$/.test(fSize)) fSize += 'px';
    const speed = parseFloat(get('speed', 2));

    const lifeUrl = get('lifeimg') || DEFAULTS.life;
    const lDiv = document.getElementById('lives');
    if (lifeUrl) for(let i=0; i<3; i++) lDiv.innerHTML += `<div class="life" style="background-image:url('${lifeUrl}')"></div>`;

    function buildDeck() {
        const base = allData.slice(); shuffle(base);
        const activePairs = base.slice(0, Math.min(limit, base.length));
        const remaining = base.slice(activePairs.length);
        let deck = [];
        activePairs.forEach((p, i) => { deck.push({t: p.a, id: i}); deck.push({t: p.b, id: i}); });
        const activeText = new Set();
        activePairs.forEach(p => { activeText.add(String(p.a)); activeText.add(String(p.b)); });
        let trapPool = [];
        remaining.forEach(p => { const pick = Math.random() > 0.5 ? p.a : p.b; if (!activeText.has(String(pick))) trapPool.push(pick); });
        trapPool = Array.from(new Set(trapPool)); shuffle(trapPool);
        const finalTraps = trapPool.slice(0, Math.max(0, extraCount));
        finalTraps.forEach((t, i) => { deck.push({t: t, id: -100 - i}); });
        shuffle(deck);
        return { deck, activePairs };
    }

    let built = buildDeck();
    const deck = built.deck;
    const activePairs = built.activePairs;
    let lives = 3, found = 0, selected = [], cards = [], gameStarted = false;
    let winPlayed = false, losePlayed = false;

    // --- ЛОГИКА СТИЛЕЙ КАРТОЧЕК ---
    const customBg = get('cimg','');
    const useDefBg = get('def_bg') === '1';
    let finalBgUrl = useDefBg ? DEFAULTS.bg : customBg;
    const bgC = get('bg_c', 'rgba(255,255,255,0.8)');
    const bC = get('b_c', '#ffffff');
    const bW = get('b_w', '1');
    const bR = get('b_r', '20');

    function getBounds() {
        const ui = document.getElementById('ui');
        const r = ui.getBoundingClientRect();
        return { minX: 0, maxX: Math.max(0, window.innerWidth - cSize), minY: Math.min(window.innerHeight - cSize, Math.ceil(r.bottom + 10)), maxY: Math.max(0, window.innerHeight - cSize) };
    }
    const bounds0 = getBounds();
    const placed = [];

    function placeNonOverlapping(existing) {
        const minDist = Math.max(30, Math.floor(cSize * 0.85));
        for (let t = 0; t < 220; t++) {
            const x = bounds0.minX + Math.random() * (bounds0.maxX - bounds0.minX);
            const y = bounds0.minY + Math.random() * (bounds0.maxY - bounds0.minY);
            let ok = true;
            for (const p of existing) { if ((p.x-x)**2 + (p.y-y)**2 < minDist**2) { ok = false; break; } }
            if (ok) return { x, y };
        }
        return { x: bounds0.minX, y: bounds0.minY };
    }

    deck.forEach(item => {
        const el = document.createElement('div');
        el.className = `card ${get('effect','')}`;
        const isImage = String(item.t).startsWith('http');
        
        let style = '';
        
        if (finalBgUrl) {
            style = `background-image:url('${finalBgUrl}'); background-size:contain; background-position: center; border:none;`;
        } else {
            if (isImage) {
                style = `background:transparent; border:none;`;
            } else {
                style = `background:${bgC}; border:${bW}px solid ${bC}; border-radius:${bR}px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);`;
            }
        }
        
        el.style.cssText = `width:${cSize}px; height:${cSize}px; ${style} font-size:${fSize}; color:${get('fcolor','#333')};`;
        if (isImage) el.innerHTML = `<img src="${item.t}" style="max-width:90%; max-height:90%; object-fit:contain; pointer-events:none;">`;
        else el.innerText = item.t;

        el.onclick = () => {
            if (el.classList.contains('sel') || el.dataset.done || selected.length >= 2) return;
            playSound('click.mp3');
            el.classList.add('sel');
            selected.push({el, id: item.id});

            if(selected.length === 2) {
                const [s1, s2] = selected;
                const fb = document.getElementById('fb');
                
                if(s1.id === s2.id && s1.id >= 0) {
                    found++; combo++; updateScore(100 + (combo > 1 ? (combo-1)*20 : 0));
                    fb.src = get('winimg') || DEFAULTS.winPopup;
                    document.getElementById('p-bar').style.width = (found/Math.max(1, activePairs.length))*100 + '%';
                    selected.forEach(s => { s.el.classList.add('good'); s.el.style.display = 'none'; s.el.dataset.done = '1'; });
                    if(found === activePairs.length) { clearInterval(timerInterval); playSound('win.mp3'); setTimeout(() => { document.getElementById('win-screen').style.display='flex'; try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch(e){} }, 800); } else { playSound('ok.mp3'); }
                } else {
                    lives--; combo = 0; updateScore(-50); fb.src = get('loseimg') || DEFAULTS.losePopup;
                    const icons = document.querySelectorAll('.life'); if(icons[lives]) icons[lives].style.opacity = '0.1';
                    selected.forEach(s => { s.el.classList.add('bad'); s.el.classList.remove('sel'); });
                    setTimeout(() => { selected.forEach(s => s.el.classList.remove('bad')); selected = []; }, 1500);
                    if(lives <= 0) { clearInterval(timerInterval); playSound('lose.mp3'); setTimeout(() => { document.getElementById('lose-screen').style.display='flex'; }, 800); } else { playSound('bad.mp3'); }
                }
                fb.style.transform = 'translate(-50%, -50%) scale(1)';
                setTimeout(() => { fb.style.transform = 'translate(-50%, -50%) scale(0)'; if(selected.length===2) selected=[]; }, 600);
            }
        };

        const pos = placeNonOverlapping(placed);
        placed.push(pos);
        const cObj = { el, x: pos.x, y: pos.y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed };
        document.getElementById('game').appendChild(el);
        cards.push(cObj);
    });

    function startGame() {
        document.getElementById('start-screen').style.display='none';
        gameStarted = true;
        if(timeLimit > 0) {
            const tb = document.getElementById('timer-box'); tb.style.display = 'flex'; tb.innerText = formatTime(timeLimit);
            timerInterval = setInterval(() => {
                timeLimit--; tb.innerText = formatTime(timeLimit);
                if(timeLimit <= 0) { 
                    clearInterval(timerInterval); 
                    playSound('time.mp3'); // Звук конца времени
                    document.getElementById('timeout-screen').style.display = 'flex'; 
                }
            }, 1000);
        }
        loop();
    }
    function closeTimeout() { document.getElementById('timeout-screen').style.display = 'none'; }
    function loop() {
        if(!gameStarted) return;
        const b = getBounds();
        cards.forEach(c => {
            if(c.el.dataset.done) return;
            c.x += c.vx; c.y += c.vy;
            if(c.x < b.minX) { c.x = b.minX; c.vx *= -1; } if(c.x > b.maxX) { c.x = b.maxX; c.vx *= -1; }
            if(c.y < b.minY) { c.y = b.minY; c.vy *= -1; } if(c.y > b.maxY) { c.y = b.maxY; c.vy *= -1; }
            c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
        });
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
